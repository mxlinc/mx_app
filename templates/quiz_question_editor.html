<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question Editor – {{ quiz_code or quiz_title }}</title>

    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

    <!-- FontAwesome & Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500;600&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">

    <!-- Question rendering styles (same as quiz_display.html) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/question-templates.css') }}">
    <!-- Shared builder form styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/question-builder-form.css') }}">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            font-family: 'Poppins', sans-serif;
            background: #f0f4f8;
            color: #333;
            overflow: hidden;
        }

        /* ── Top bar ── */
        #topBar {
            height: 48px;
            background: #1b3a6f;
            color: white;
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 0 16px;
            flex-shrink: 0;
        }

        #topBar a {
            color: #a8c4e0;
            text-decoration: none;
            font-size: 0.88rem;
            white-space: nowrap;
        }

        #topBar a:hover { color: white; }

        #quizHeading {
            font-size: 0.95rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        #questionCount {
            font-size: 0.82rem;
            font-weight: 500;
            color: #a8c4e0;
            white-space: nowrap;
            margin-left: auto;
        }

        /* ── Chips row ── */
        #chipsRow {
            background: white;
            border-bottom: 1px solid #dde4ed;
            padding: 8px 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            flex-shrink: 0;
            max-height: 120px;
            overflow-y: auto;
        }

        .chip {
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid #b0c4d8;
            background: #f4f7fb;
            font-size: 0.78rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            color: #1b3a6f;
        }

        .chip:hover { background: #dce8f5; border-color: #7aaac8; }

        .chip.active {
            background: #1b3a6f;
            color: white;
            border-color: #1b3a6f;
        }

        /* ── Two-panel layout ── */
        #panels {
            display: flex;
            flex: 1;
            overflow: hidden;
            height: calc(100vh - 48px - 56px); /* subtract topBar + chipsRow approx */
        }

        /* Left: builder */
        #leftPanel {
            width: 45%;
            overflow-y: auto;
            border-right: 2px solid #dde4ed;
            background: #faf7f5;
            padding: 12px;
            flex-shrink: 0;
        }

        /* Right: preview */
        #rightPanel {
            flex: 1;
            overflow-y: auto;
            background: #f8fafc;
            padding: 20px;
        }

        #rightPanelPlaceholder {
            color: #aaa;
            text-align: center;
            margin-top: 80px;
            font-size: 0.95rem;
        }

    </style>
</head>
<body>

<!-- ── Top Bar ── -->
<div id="topBar">
    <a href="/quiz/list"><i class="fas fa-arrow-left"></i> Exit</a>
    <div id="quizHeading">
        {% if quiz_code %}{{ quiz_code }}: {% endif %}{{ quiz_title }}
    </div>
    <div id="questionCount"></div>
</div>

<!-- ── Chips Row ── -->
<div id="chipsRow">
    <span style="font-size:0.8rem;color:#888;">Loading questions…</span>
</div>

<!-- ── Two-panel layout ── -->
<div id="panels">

    <!-- LEFT: Builder Form -->
    <div id="leftPanel">

        {% set show_builder_delete_btn = true %}
        {% include '_question_builder_form.html' %}
    </div><!-- /leftPanel -->

    <!-- RIGHT: Preview -->
    <div id="rightPanel">
        <div id="rightPanelPlaceholder">
            <i class="fas fa-mouse-pointer" style="font-size:2rem;display:block;margin-bottom:12px;color:#ccc;"></i>
            Select a question chip above to preview it here.
        </div>
    </div>

</div><!-- /panels -->


<!-- ── Question-type handler scripts ── -->
<script src="{{ url_for('static', filename='js/quiz-common.js') }}"></script>
<script src="{{ url_for('static', filename='js/quiz-mcq.js') }}"></script>
<script src="{{ url_for('static', filename='js/quiz-mr.js') }}"></script>
<script src="{{ url_for('static', filename='js/quiz-fill.js') }}"></script>
<script src="{{ url_for('static', filename='js/quiz-feval.js') }}"></script>

<!-- ── Shared builder logic ── -->
<script src="{{ url_for('static', filename='js/ohs-hotspot.js') }}"></script>
<script src="{{ url_for('static', filename='js/quiz-builder-form.js') }}?v=4"></script>

<!-- ── UnifiedQuestionComponent dependencies ── -->
<script src="{{ url_for('static', filename='js/question-templates.js') }}"></script>
<script src="{{ url_for('static', filename='js/template-handlers.js') }}"></script>
<script src="{{ url_for('static', filename='js/unified-question-component.js') }}"></script>
<script src="{{ url_for('static', filename='js/quiz-calculator.js') }}"></script>

<script>
    // Flask template data
    const QUIZ_ID = {{ quiz_id }};

    // ── Right-panel renderer ──────────────────────────────────────────────
    async function renderRightPanel(questionId) {
        const panel = document.getElementById('rightPanel');
        panel.innerHTML = '<div style="padding:40px;text-align:center;color:#aaa;font-size:0.9em;">Loading preview…</div>';
        try {
            const resp = await fetch(`/question/api/display/${questionId}`);
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const data = await resp.json();
            if (!data.ok || !data.question) throw new Error('Invalid question data');
            const question = data.question;

            // Render area
            const renderArea = document.createElement('div');
            renderArea.style.cssText = 'padding:20px;';
            panel.innerHTML = '';
            panel.appendChild(renderArea);

            const component = new UnifiedQuestionComponent({
                question: question,
                container: renderArea,
                readOnly: false
            });
            component.render();
            panel._component = component;

            // Submit button row
            const btnRow = document.createElement('div');
            btnRow.style.cssText = 'padding:12px 20px;border-top:1px solid #e5e5e0;background:#f5f5f3;display:flex;gap:10px;align-items:center;';

            const submitBtn = document.createElement('button');
            submitBtn.textContent = 'Submit';
            submitBtn.style.cssText = 'background:#1b3a6f;color:white;padding:10px 28px;border:none;border-radius:6px;font-size:0.95em;font-weight:600;cursor:pointer;font-family:Poppins,sans-serif;';

            const tryAgainBtn = document.createElement('button');
            tryAgainBtn.textContent = 'Try Again';
            tryAgainBtn.style.cssText = 'background:#6c757d;color:white;padding:10px 20px;border:none;border-radius:6px;font-size:0.95em;font-weight:600;cursor:pointer;font-family:Poppins,sans-serif;display:none;';

            submitBtn.addEventListener('click', async () => {
                if (!panel._component) return;
                await panel._component.submitAnswer();
                submitBtn.style.display = 'none';
                tryAgainBtn.style.display = 'inline-block';
            });

            tryAgainBtn.addEventListener('click', () => renderRightPanel(questionId));

            btnRow.appendChild(submitBtn);
            btnRow.appendChild(tryAgainBtn);
            panel.appendChild(btnRow);

        } catch (err) {
            panel.innerHTML = `<div style="padding:20px;color:#c00;">Error loading preview: ${err.message}</div>`;
        }
    }

    // ── Chip selection ────────────────────────────────────────────────────
    let activeChipId = null;

    async function selectQuestion(questionId) {
        // Highlight chip
        document.querySelectorAll('.chip').forEach(c => {
            c.classList.toggle('active', parseInt(c.dataset.qid) === questionId);
        });
        activeChipId = questionId;

        // Load into left panel (builder) and right panel (preview) in parallel
        await Promise.all([
            loadQuestionForEdit(questionId),
            renderRightPanel(questionId)
        ]);
    }

    // ── After save: refresh only right panel ─────────────────────────────
    window.onQuestionSaved = function(result) {
        renderRightPanel(result.question_id);
    };

    // ── Bootstrap ─────────────────────────────────────────────────────────
    window.addEventListener('DOMContentLoaded', async () => {
        initBuilderForm();

        try {
            const resp = await fetch(`/quiz/api/${QUIZ_ID}`);
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const data = await resp.json();

            const chipsRow = document.getElementById('chipsRow');
            const questions = data.questions || [];

            if (questions.length === 0) {
                chipsRow.innerHTML = '<span style="font-size:0.82rem;color:#888;">No questions in this quiz.</span>';
                return;
            }

            document.getElementById('questionCount').textContent =
                `${questions.length} question${questions.length !== 1 ? 's' : ''}`;

            chipsRow.innerHTML = '';
            questions.forEach(q => {
                const chip = document.createElement('div');
                chip.className = 'chip';
                chip.dataset.qid = q.id;
                chip.textContent = `${q.id}`;
                chip.title = q.preview ? q.preview.substring(0, 80) : '';
                chip.addEventListener('click', () => selectQuestion(q.id));
                chipsRow.appendChild(chip);
            });

            // Auto-select first question
            selectQuestion(questions[0].id);

        } catch (err) {
            document.getElementById('chipsRow').innerHTML =
                `<span style="color:#c00;font-size:0.82rem;">Failed to load quiz questions: ${err.message}</span>`;
        }

        // Delete button
        document.getElementById('deleteBtn').addEventListener('click', async () => {
            if (!activeChipId) return;
            if (!confirm(`Permanently delete question ${activeChipId}? This cannot be undone.`)) return;
            const resp = await fetch(`/question/api/delete/${activeChipId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ exclude_quiz_id: QUIZ_ID })
            });
            const data = await resp.json();
            if (data.ok) {
                location.reload();
            } else {
                alert('Delete failed: ' + (data.error || 'Unknown error'));
            }
        });
    });
</script>
</body>
</html>
